name: 스킬 패키지 확인

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: 구성·참조·UTF-8 확인
        run: python -X utf8 scripts/check_package.py
      - name: 손상 감지·ZIP 무결성 확인
        run: python -X utf8 -m unittest discover -s tests -v
      - name: 배포 후보 생성
        run: python -X utf8 scripts/build_package.py

